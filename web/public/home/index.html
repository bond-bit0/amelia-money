<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Press Start 2P", "Courier New", monospace;
    color: #fff; background: #6ec3f4; overflow-x: hidden;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    image-rendering: pixelated;
  }
  .sky {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    padding: 48px 20px 40px;
    background: linear-gradient(#4aa8ec 0%, #6ec3f4 55%, #a9defa 100%);
    overflow: hidden;
  }
  .sun { position: absolute; top: 7%; right: 9%; width: 72px; height: 72px; background: #ffe066; box-shadow: 0 0 0 8px #fff3a8; }
  .cloud { position: absolute; width: 16px; height: 16px; background: #fff; opacity: .95;
    box-shadow: 16px 0 #fff, 32px 0 #fff, 48px 0 #fff, 64px 0 #fff, 80px 0 #fff,
      16px -16px #fff, 32px -16px #fff, 48px -16px #fff, 64px -16px #fff, 32px -32px #fff, 48px -32px #fff,
      0 16px #eef6fb, 16px 16px #eef6fb, 32px 16px #eef6fb, 48px 16px #eef6fb, 64px 16px #eef6fb, 80px 16px #eef6fb;
    animation: drift linear infinite; }
  .c1 { top: 14%; left: -120px; animation-duration: 70s; }
  .c2 { top: 34%; left: -120px; animation-duration: 95s; animation-delay: -40s; transform: scale(.75); }
  .c3 { top: 60%; left: -120px; animation-duration: 120s; animation-delay: -80s; transform: scale(.6); opacity: .8; }
  @keyframes drift { to { translate: calc(100vw + 240px) 0; } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 12%; } .c2 { left: 55%; } .c3 { left: 30%; } }

  .panel { position: relative; z-index: 1; text-align: center; max-width: 760px; }
  .hello { font-size: clamp(11px, 2.4vw, 16px); color: #fff3a8; text-shadow: 2px 2px 0 #2b4a63; margin: 0 0 18px; letter-spacing: 1px; }
  h1 { margin: 0; font-size: clamp(22px, 6.2vw, 52px); line-height: 1.35; font-weight: 400;
    text-shadow: 4px 4px 0 #2e2e2e, 0 0 0 #000; }
  h1 span { display: block; color: #ffe066; }
